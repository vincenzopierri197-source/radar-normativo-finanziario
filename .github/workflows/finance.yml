name: Radar finanziario indipendente

on:
  workflow_dispatch:
  schedule:
    # Primo tentativo alle 08:00 italiane, poi retry orario fino alle 12:00.
    - cron: "0 6-12 * * *"

permissions:
  contents: write

concurrency:
  group: radar-finanziario-main
  cancel-in-progress: false

jobs:
  financial-briefing:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verifica finestra italiana e idempotenza giornaliera
        id: window
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today="$(TZ=Europe/Rome date +%F)"
          if [[ -f data/.financial_last_run_date ]] && [[ "$(cat data/.financial_last_run_date)" == "$today" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Radar finanziario già eseguito oggi ($today)."
            exit 0
          fi
          # Accetta i retry schedulati tardivi finché restano nella data locale corrente.
          local_hour="$(TZ=Europe/Rome date +%H)"
          if (( 10#$local_hour < 8 )); then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Run schedulato anticipato rispetto alle 08:00 Europe/Rome."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.window.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        if: steps.window.outputs.run == 'true'
        run: python -m pip install .

      - name: Send independent financial briefing to Telegram
        if: steps.window.outputs.run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-20b
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram non configurato: invio saltato."
            exit 1
          fi
          printf '{"items": []}\n' > /tmp/radar-finanziario-items.json
          python -m radar_normativo telegram \
            --input /tmp/radar-finanziario-items.json \
            --ledger /tmp/radar-finanziario-ledger.json \
            --finance

      - name: Mark successful daily run
        if: steps.window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          TZ=Europe/Rome date +%F > data/.financial_last_run_date
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/.financial_last_run_date
          if ! git diff --cached --quiet; then
            git commit -m "chore: mark financial radar daily run"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [[ "$attempt" -eq 5 ]]; then
                echo "Push fallito dopo 5 tentativi."
                exit 1
              fi
              echo "Push in conflitto, nuovo tentativo ($attempt/5)..."
              sleep "$((attempt * 2))"
            done
          else
            echo "Marker giornaliero già aggiornato: nessuna modifica da salvare."
          fi
