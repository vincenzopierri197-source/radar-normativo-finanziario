name: Monitoraggio report giornalieri

on:
  # I radar riprovano fino alle 12:00 UTC; il margine lascia concludere i job
  # avviati nell'ultimo slot. UTC fisso evita cron mancanti nei cambi DST.
  schedule:
    - cron: "15 15 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: monitor-radar-reports
  cancel-in-progress: false

jobs:
  check-daily-reports:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check scheduled report runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/monitor_workflows.py
